name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # .github/workflows/release.yml runs these checks on a tag before it publishes

# Called from release.yml, github.workflow is "Release", so this group is the caller's own name and
# tag; release.yml must not set a concurrency group of that shape or the run waits on itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs scripts/verify.sh: the agent-layer check, verify.sh's own test, the pre-push hook's test,
  # bootstrap.sh's ruleset test against a stub gh, the eval case parser's test over every case in
  # evals/, the eval runner and cleanup scripts' tests against a stub gh, the claim read-back and
  # frontier query tests and the Jev tools' tests against a fake server (plain Node, no packages,
  # plus the runner's jq for the query tests and the stubs; no TYPESAFE_API_KEY: Jev never runs in
  # CI, ADR-0002), the gitleaks secret scan, and PixelRig's checks: Lua syntax (luac5.4), the
  # pure-Lua tests (tests/pure.lua, lua5.4), clip and rig JSON, the release gate's test and notes,
  # the release archive, and tools/test.sh's self-test against a stub binary. The Aseprite batch
  # tests need a binary CI does not have; they run locally (AGENTS.md § Verifying your work).
  # Update AGENTS.md § Verifying your work in the same commit.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # the secret scan reads every commit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install Lua 5.4 (Aseprite's Lua) for the syntax check and pure-Lua tests
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.4
      - run: scripts/verify.sh
