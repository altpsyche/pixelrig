name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  # Everything CI runs (scripts/verify.sh, through ci.yml) on the tagged commit. Red stops the
  # release: the publish job needs this one.
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job, and only to create the release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # the gate checks the tag is on origin/main
          persist-credentials: false

      # Fails unless the tag is v<package.json version>, its commit is on origin/main, and
      # docs/releases/<tag>.md names this version and no other. Prints the notes to publish.
      - name: Check the tag and its notes
        run: tools/release-check.sh "$GITHUB_REF_NAME" origin/main > "$RUNNER_TEMP/notes.md"

      - name: Build packages
        run: tools/package.sh

      - name: Check the archive holds only the extension
        run: tools/check-archive.sh "dist/pixelrig-$GITHUB_REF_NAME.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "PixelRig $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            $prerelease
