name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the gate checks the tag is on origin/main

      # Fails unless the tag is v<package.json version>, its commit is on origin/main, and
      # docs/releases/<tag>.md names this version and no other. Prints the notes to publish.
      - name: Check the tag and its notes
        run: tools/release-check.sh "$GITHUB_REF_NAME" origin/main > "$RUNNER_TEMP/notes.md"

      - name: Build packages
        run: tools/package.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "PixelRig $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            $prerelease
